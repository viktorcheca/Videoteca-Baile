<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videoteca del Baile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#eee}
header{padding:35px 20px 22px;text-align:center;border-bottom:1px solid #292929}
h1{margin:0 0 8px;font-size:clamp(2rem,6vw,4rem)}
main{width:min(1100px,calc(100% - 30px));margin:28px auto}
.search{width:100%;padding:14px 16px;border:1px solid #333;border-radius:12px;background:#1b1b1b;color:#fff;font-size:1rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 25px}
.filter{padding:9px 14px;border-radius:999px;border:1px solid #3a3a3a;background:#1b1b1b;color:#ddd;cursor:pointer}
.filter.active{background:#eee;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.card{display:block;text-decoration:none;color:inherit;background:#1b1b1b;border:1px solid #292929;border-radius:14px;overflow:hidden}
.preview{aspect-ratio:16/10;background:#252525;display:grid;place-items:center;font-size:3rem}
.info{padding:15px}.info h2{margin:0 0 8px;font-size:1.15rem}.info p{margin:5px 0;color:#aaa}
</style>
</head>
<body>
<header><h1>VIDEOTECA DEL BAILE</h1><div>Prueba de reproductor interno</div></header>
<main>
<input id="search" class="search" placeholder="Buscar vídeo, profesor, baile...">
<div id="filters" class="filters"></div>
<div id="grid" class="grid"></div>
</main>
<script src="data.js"></script>
<script>
const grid=document.getElementById("grid"), filters=document.getElementById("filters"), search=document.getElementById("search");
let profesorActivo="Todos";
const profesores=["Todos",...[...new Set(videos.flatMap(v=>v.profesores))].sort((a,b)=>a.localeCompare(b,"es"))];

function drawFilters(){
  filters.innerHTML="";
  profesores.forEach(p=>{
    const b=document.createElement("button");
    b.className="filter"+(p===profesorActivo?" active":"");
    b.textContent=p;
    b.onclick=()=>{profesorActivo=p;drawFilters();render()};
    filters.appendChild(b);
  });
}
function render(){
  const q=search.value.toLowerCase().trim();
  grid.innerHTML="";
  videos.filter(v=>{
    const text=[v.titulo,v.baile,v.tipo,...v.profesores,...(v.tags||[])].join(" ").toLowerCase();
    return (profesorActivo==="Todos"||v.profesores.includes(profesorActivo)) && text.includes(q);
  }).forEach(v=>{
    const a=document.createElement("a");
    a.className="card";
    a.href=`player.html?id=${encodeURIComponent(v.id)}`;
    a.innerHTML=`<div class="preview">▶</div><div class="info"><h2>${v.titulo}</h2><p>${v.profesores.join(" · ")}</p><p>${v.baile} · ${v.tipo}</p></div>`;
    grid.appendChild(a);
  });
}
search.addEventListener("input",render);
drawFilters(); render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Videoteca del Baile</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header>
  <h1>VIDEOTECA DEL BAILE</h1>
  <p class="subtitle">Nuestra biblioteca de figuras y clases</p>
</header>
<main>
  <input id="search" class="search" type="search" placeholder="Buscar nombre, artista, estilo, lugar..." autocomplete="off">
  <div class="filters" id="filtroEstilo"></div>
  <div class="filters" id="filtroSubestilo"></div>
  <div class="artist-filter">
      <span class="artist-label">Artista:</span>
      <div class="artist-select-wrap">
        <select id="filtroArtista" class="artist-select" aria-label="Filtrar por artista"></select>
      </div>
    </div>
  <div id="count" class="count"></div>
  <div id="grid" class="grid"></div>
</main>

<script src="data.js"></script>
<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const filtroEstilo = document.getElementById("filtroEstilo");
const filtroSubestilo = document.getElementById("filtroSubestilo");
const filtroArtista = document.getElementById("filtroArtista");

// Convención automática:
// Lugar "Harmony" -> img/Harmony.png
// Lugar "La Clave" -> img/La Clave.png
function rutaLogo(lugar) {
  if (!lugar) return "";
  return `img/${encodeURIComponent(lugar).replaceAll("%20", " ")}.png`;
}


let seleccion = { estilo: "Todos", subestilo: "Todos", artista: "Todos" };

function unicos(lista) {
  return [...new Set(lista.filter(Boolean))].sort((a,b) => a.localeCompare(b, "es"));
}
function esc(t) {
  return String(t ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function coincideTexto(v, texto) {
  if (!texto) return true;
  return [v.id,v.nombre,v.estilo,v.subestilo,v.lugar,...(v.artistas||[])]
    .join(" ").toLowerCase().includes(texto.toLowerCase());
}
function coincideFiltros(v, ignorar="") {
  if (ignorar!=="estilo" && seleccion.estilo!=="Todos" && v.estilo!==seleccion.estilo) return false;
  if (ignorar!=="subestilo" && seleccion.subestilo!=="Todos" && v.subestilo!==seleccion.subestilo) return false;
  if (ignorar!=="artista" && seleccion.artista!=="Todos" && !(v.artistas||[]).includes(seleccion.artista)) return false;
  return true;
}
function valoresDisponibles(tipo) {
  const base = videos.filter(v => coincideFiltros(v,tipo));
  if (tipo==="estilo") return unicos(base.map(v=>v.estilo));
  if (tipo==="subestilo") return unicos(base.map(v=>v.subestilo));
  return unicos(base.flatMap(v=>v.artistas||[]));
}
function normalizarSeleccion() {
  let cambio=true;
  while(cambio){
    cambio=false;
    for(const tipo of ["estilo","subestilo","artista"]){
      if(seleccion[tipo]!=="Todos" && !valoresDisponibles(tipo).includes(seleccion[tipo])){
        seleccion[tipo]="Todos"; cambio=true;
      }
    }
  }
}
function crearBotones(el, valores, tipo, etiqueta) {
  el.innerHTML="";
  ["Todos",...valores].forEach(valor=>{
    const b=document.createElement("button");
    b.className="filter"+(seleccion[tipo]===valor?" active":"");
    b.textContent=valor==="Todos"?`${etiqueta}: Todos`:valor;
    b.onclick=()=>{seleccion[tipo]=valor; actualizar();};
    el.appendChild(b);
  });
}
function renderArtistas() {
  const artistas = valoresDisponibles("artista");
  const valorActual = seleccion.artista;

  filtroArtista.innerHTML = "";

  const todos = document.createElement("option");
  todos.value = "Todos";
  todos.textContent = "Todos los artistas";
  filtroArtista.appendChild(todos);

  artistas.forEach(artista => {
    const option = document.createElement("option");
    option.value = artista;
    option.textContent = artista;
    filtroArtista.appendChild(option);
  });

  filtroArtista.value = artistas.includes(valorActual) ? valorActual : "Todos";
}

function renderFiltros(){
  crearBotones(filtroEstilo,valoresDisponibles("estilo"),"estilo","Estilo");
  crearBotones(filtroSubestilo,valoresDisponibles("subestilo"),"subestilo","Subestilo");
  renderArtistas();
}
function renderVideos(){
  const resultados=videos.filter(v=>coincideFiltros(v)&&coincideTexto(v,search.value.trim()));
  count.textContent=`${resultados.length} vídeo${resultados.length===1?"":"s"}`;
  grid.innerHTML="";
  if(!resultados.length){
    grid.innerHTML='<div class="empty">No hay vídeos que coincidan con estos filtros.</div>'; return;
  }
  resultados.forEach(v=>{
    const card=document.createElement("a");
    card.className="card"; card.href=v.url||"#";
    if(v.url&&v.url!=="#"){card.target="_blank"; card.rel="noopener noreferrer";}
    const artistas=(v.artistas||[]).join(" · ");
    const detalle=[v.estilo,v.subestilo].filter(Boolean).join(" · ");
    const logo = rutaLogo(v.lugar);
    const preview = v.lugar
      ? `<div class="preview preview-logo">
           <img
             class="place-logo"
             src="${logo}"
             alt="${esc(v.lugar)}"
             loading="lazy"
             onerror="this.style.display='none'; this.parentElement.classList.remove('preview-logo');"
           >
           <div class="play">▶</div>
         </div>`
      : `<div class="preview"><div class="play">▶</div></div>`;
    card.innerHTML=`${preview}<div class="info">
      <h2 class="title">${esc(v.nombre||`Vídeo ${v.id}`)}</h2>
      <p class="teachers">${esc(artistas)}</p>
      <p class="meta">${esc(detalle)}</p>
      ${v.lugar?`<p class="meta">📍 ${esc(v.lugar)}</p>`:""}
    </div>`;
    grid.appendChild(card);
  });
}
function actualizar(){ normalizarSeleccion(); renderFiltros(); renderVideos(); }
search.addEventListener("input",renderVideos);

filtroArtista.addEventListener("change", () => {
  seleccion.artista = filtroArtista.value;
  actualizar();
});

actualizar();
</script>
</body>
</html>

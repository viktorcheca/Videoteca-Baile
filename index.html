<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><title>Videoteca del Baile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>VIDEOTECA DEL BAILE</h1><p class="subtitle">Nuestra biblioteca de figuras y clases</p></header>
<main>
<input id="search" class="search" type="search" placeholder="Buscar profesor, figura, baile..." autocomplete="off">
<div id="filters" class="filters"></div><div id="count" class="count"></div><div id="grid" class="grid"></div>
</main>
<script src="data.js"></script>
<script>
const grid=document.getElementById("grid"),filters=document.getElementById("filters"),search=document.getElementById("search"),count=document.getElementById("count");
let profesorActivo="Todos";
const profesores=["Todos",...[...new Set(videos.flatMap(v=>v.profesores))].sort((a,b)=>a.localeCompare(b,"es"))];
function crearFiltros(){filters.innerHTML="";profesores.forEach(p=>{const b=document.createElement("button");b.className="filter"+(p===profesorActivo?" active":"");b.textContent=p;b.onclick=()=>{profesorActivo=p;crearFiltros();render()};filters.appendChild(b)})}
function coincide(v,q){return[v.titulo,v.baile,v.tipo,...v.profesores,...(v.tags||[])].join(" ").toLowerCase().includes(q.toLowerCase())}
function render(){const q=search.value.trim();const rs=videos.filter(v=>(profesorActivo==="Todos"||v.profesores.includes(profesorActivo))&&coincide(v,q));count.textContent=`${rs.length} vídeo${rs.length===1?"":"s"}`;grid.innerHTML="";
if(!rs.length){grid.innerHTML='<div class="empty">No hay vídeos que coincidan con la búsqueda.</div>';return}
rs.forEach(v=>{const a=document.createElement("a");a.className="card";a.href=v.url||"#";if(v.url&&v.url!=="#"){a.target="_blank";a.rel="noopener noreferrer"}
a.innerHTML=`<div class="preview"><div class="play">▶</div></div><div class="info"><h2 class="title">${v.titulo}</h2><p class="teachers">${v.profesores.join(" · ")}</p><p class="meta">${v.baile} · ${v.tipo}</p></div>`;
if(!v.url||v.url==="#")a.onclick=e=>{e.preventDefault();alert("Este vídeo todavía no tiene enlace de Google Drive.")};grid.appendChild(a)})}
search.addEventListener("input",render);crearFiltros();render();
</script></body></html>

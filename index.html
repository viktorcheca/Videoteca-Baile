<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoteca del Baile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#111; color:#eee; }
    header { padding:42px 20px 26px; text-align:center; border-bottom:1px solid #292929; }
    h1 { margin:0 0 10px; font-size:clamp(2rem,6vw,4.5rem); letter-spacing:.03em; }
    .sub { color:#aaa; margin:0; }
    main { width:min(1180px,calc(100% - 32px)); margin:30px auto 60px; }
    .search { width:100%; padding:15px 18px; border-radius:12px; border:1px solid #333;
              background:#1c1c1c; color:white; font-size:1rem; outline:none; }
    .search:focus { border-color:#777; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 28px; }
    .filter { border:1px solid #3a3a3a; background:#1b1b1b; color:#ddd;
              padding:9px 14px; border-radius:999px; cursor:pointer; }
    .filter:hover,.filter.active { background:#eee; color:#111; border-color:#eee; }
    .count { color:#999; margin-bottom:14px; font-size:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }

    /* Ahora la tarjeta ES un enlace real */
    .card {
      display:block;
      background:#1b1b1b;
      border:1px solid #292929;
      border-radius:14px;
      overflow:hidden;
      color:inherit;
      text-decoration:none;
      transition:transform .15s ease,border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card:hover { transform:translateY(-3px); border-color:#555; }
    .preview { aspect-ratio:16/10; background:#252525; display:grid; place-items:center; font-size:3rem; }
    .info { padding:15px; }
    .title { margin:0 0 8px; font-size:1.15rem; }
    .teachers { margin:0 0 7px; color:#ddd; }
    .meta { margin:0; color:#888; font-size:.9rem; }
    .empty { color:#999; padding:35px 0; }
  </style>
</head>
<body>
<header>
  <h1>VIDEOTECA DEL BAILE</h1>
  <p class="sub">Prototipo local</p>
</header>

<main>
  <input id="search" class="search" type="search"
         placeholder="Buscar vídeo, profesor, baile, tipo..." autocomplete="off">
  <div id="filters" class="filters"></div>
  <div id="count" class="count"></div>
  <div id="grid" class="grid"></div>
</main>

<script src="data.js"></script>
<script>
  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const search = document.getElementById("search");
  const count = document.getElementById("count");

  let profesorActivo = "Todos";

  const profesores = [
    "Todos",
    ...[...new Set(videos.flatMap(v => v.profesores))]
      .sort((a,b) => a.localeCompare(b,"es"))
  ];

  function crearFiltros() {
    filters.innerHTML = "";
    profesores.forEach(profesor => {
      const button = document.createElement("button");
      button.className = "filter" + (profesor === profesorActivo ? " active" : "");
      button.textContent = profesor;
      button.addEventListener("click", () => {
        profesorActivo = profesor;
        crearFiltros();
        render();
      });
      filters.appendChild(button);
    });
  }

  function coincideBusqueda(video,texto) {
    const contenido = [
      video.titulo, video.baile, video.tipo,
      ...video.profesores, ...(video.tags || [])
    ].join(" ").toLowerCase();
    return contenido.includes(texto.toLowerCase());
  }

  function render() {
    const texto = search.value.trim();
    const resultado = videos.filter(video => {
      const coincideProfesor =
        profesorActivo === "Todos" || video.profesores.includes(profesorActivo);
      return coincideProfesor && coincideBusqueda(video,texto);
    });

    count.textContent = `${resultado.length} vídeo${resultado.length === 1 ? "" : "s"}`;
    grid.innerHTML = "";

    if (!resultado.length) {
      grid.innerHTML = '<div class="empty">No hay vídeos que coincidan.</div>';
      return;
    }

    resultado.forEach(video => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = video.url || "#";

      /* Enlace real: el móvil puede reconocerlo con pulsación larga */
      if (video.url && video.url !== "#") {
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      }

      card.innerHTML = `
        <div class="preview">▶</div>
        <div class="info">
          <h2 class="title">${video.titulo}</h2>
          <p class="teachers">${video.profesores.join(" · ")}</p>
          <p class="meta">${video.baile} · ${video.tipo}</p>
        </div>
      `;

      if (!video.url || video.url === "#") {
        card.addEventListener("click", e => {
          e.preventDefault();
          alert("Este vídeo todavía no tiene enlace de Google Fotos.");
        });
      }

      grid.appendChild(card);
    });
  }

  search.addEventListener("input",render);
  crearFiltros();
  render();
</script>
</body>
</html>

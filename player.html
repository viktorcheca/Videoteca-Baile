<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reproductor · Videoteca del Baile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#111;color:#eee}
body{display:flex;flex-direction:column}
.topbar{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#181818;border-bottom:1px solid #333}
.back{color:#fff;text-decoration:none;font-weight:bold;padding:10px 12px;border:1px solid #444;border-radius:10px}
.meta{min-width:0}.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:.85rem;color:#999;margin-top:3px}
.framewrap{position:relative;flex:1;min-height:0}
iframe{display:block;width:100%;height:100%;border:0;background:#222}
.message{display:none;position:absolute;inset:0;padding:30px;place-items:center;text-align:center;background:#181818;color:#bbb}
.open{color:#fff}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Videoteca</a>
  <div class="meta">
    <div id="title" class="title">Cargando…</div>
    <div id="sub" class="sub"></div>
  </div>
</div>

<div class="framewrap">
  <iframe id="frame" title="Google Fotos"></iframe>
  <div id="message" class="message">
    <div>
      <p>Si Google Fotos bloquea esta ventana, el iframe no es viable.</p>
      <p><a id="open" class="open" href="#" target="_blank" rel="noopener noreferrer">Abrir vídeo directamente ↗</a></p>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const params=new URLSearchParams(location.search);
const id=Number(params.get("id"));
const video=videos.find(v=>v.id===id);

if(!video){
  document.getElementById("title").textContent="Vídeo no encontrado";
  document.getElementById("message").style.display="grid";
}else{
  document.title=video.titulo+" · Videoteca del Baile";
  document.getElementById("title").textContent=video.titulo;
  document.getElementById("sub").textContent=video.profesores.join(" · ")+" — "+video.baile+" · "+video.tipo;
  document.getElementById("open").href=video.url;

  if(!video.url || video.url==="#"){
    document.getElementById("message").style.display="grid";
  }else{
    document.getElementById("frame").src=video.url;
  }
}
</script>
</body>
</html>
